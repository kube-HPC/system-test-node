name: Self-hosted smoke

# Temporary scaffolding to validate the self-hosted runners before migrating CI-MAIN.
# Targets the e2e environment only, matching the `*e2e*` case in hkube's deploy.yml:
#   CONTEXT=e2e.hkube.org, URL=$E2E_URL
# Runs the same suites as CI-MAIN, minus the Deployment job.
# Delete this file once all jobs pass.

on:
  workflow_dispatch:

env:
  KUBE_CONTEXT: e2e.hkube.org
  # in-VPC path hits the ingress default cert
  NODE_TLS_REJECT_UNAUTHORIZED: "0"

jobs:
  SwaggerTests:
    runs-on: [self-hosted, hkube-system-test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: runner info
        run: |
          echo "runner=$RUNNER_NAME user=$(whoami) host=$(hostname)"
          echo "workspace=$GITHUB_WORKSPACE temp=$RUNNER_TEMP"
          echo "context=$KUBE_CONTEXT"
          node -v; npm -v; kubectl version --client | head -1; helm version --short
      - name: resolve base url
        run: |
          # E2E_URL may or may not carry a scheme; normalise to exactly one
          URL="$E2E_URL"
          case "$URL" in
            https://*|http://*) ;;
            *) URL="https://$URL" ;;
          esac
          echo "BASE_URL=$URL" >> $GITHUB_ENV
          echo "resolved host: $(echo "$URL" | sed -E 's#^https?://##' | cut -d/ -f1)"
        env:
          E2E_URL: ${{ secrets.E2E_URL }}
      - run: npm ci --prefer-offline
      - name: test
        run: npm test
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_MASTER_URL }}
          KEYCLOAK_DEV_PASS: ${{ secrets.KEYCLOAK_DEV_PASS }}
          KEYCLOAK_DEV_USER: ${{ secrets.KEYCLOAK_DEV_USER }}
          KEYCLOAK_GUEST_PASS: ${{ secrets.KEYCLOAK_GUEST_PASS }}
          KEYCLOAK_GUEST_USER: ${{ secrets.KEYCLOAK_GUEST_USER }}
          LOGIN_ATTEMPTS: 2
          LOGIN_DELAY_MS: 5000

  GraphQLTests:
    runs-on: [self-hosted, hkube-system-test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: resolve base url
        run: |
          URL="$E2E_URL"
          case "$URL" in
            https://*|http://*) ;;
            *) URL="https://$URL" ;;
          esac
          echo "BASE_URL=$URL" >> $GITHUB_ENV
        env:
          E2E_URL: ${{ secrets.E2E_URL }}
      - run: npm ci --prefer-offline
      - name: test
        run: npm run graphql
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_MASTER_URL }}
          KEYCLOAK_DEV_PASS: ${{ secrets.KEYCLOAK_DEV_PASS }}
          KEYCLOAK_DEV_USER: ${{ secrets.KEYCLOAK_DEV_USER }}
          KEYCLOAK_GUEST_PASS: ${{ secrets.KEYCLOAK_GUEST_PASS }}
          KEYCLOAK_GUEST_USER: ${{ secrets.KEYCLOAK_GUEST_USER }}
          LOGIN_ATTEMPTS: 2
          LOGIN_DELAY_MS: 5000

  PipelineTests:
    runs-on: [self-hosted, hkube-system-test]
    timeout-minutes: 45
    needs: [SwaggerTests, GraphQLTests]
    steps:
      - uses: actions/checkout@v4
      - name: resolve base url
        run: |
          URL="$E2E_URL"
          case "$URL" in
            https://*|http://*) ;;
            *) URL="https://$URL" ;;
          esac
          echo "BASE_URL=$URL" >> $GITHUB_ENV
        env:
          E2E_URL: ${{ secrets.E2E_URL }}
      - run: npm ci --prefer-offline
      - name: test
        run: npm run pipelinetest
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_MASTER_URL }}
          KEYCLOAK_DEV_PASS: ${{ secrets.KEYCLOAK_DEV_PASS }}
          KEYCLOAK_DEV_USER: ${{ secrets.KEYCLOAK_DEV_USER }}
          LOGIN_ATTEMPTS: 2
          LOGIN_DELAY_MS: 5000

  JagearTests:
    runs-on: [self-hosted, hkube-system-test]
    timeout-minutes: 45
    needs: [SwaggerTests, GraphQLTests]
    steps:
      - uses: actions/checkout@v4
      - name: resolve base url
        run: |
          URL="$E2E_URL"
          case "$URL" in
            https://*|http://*) ;;
            *) URL="https://$URL" ;;
          esac
          echo "BASE_URL=$URL" >> $GITHUB_ENV
        env:
          E2E_URL: ${{ secrets.E2E_URL }}
      - run: npm ci --prefer-offline
      - name: test
        run: npm run jageartest
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_MASTER_URL }}
          KEYCLOAK_DEV_PASS: ${{ secrets.KEYCLOAK_DEV_PASS }}
          KEYCLOAK_DEV_USER: ${{ secrets.KEYCLOAK_DEV_USER }}
          LOGIN_ATTEMPTS: 2
          LOGIN_DELAY_MS: 5000

  CodeApiTests:
    runs-on: [self-hosted, hkube-system-test]
    timeout-minutes: 45
    needs: [SwaggerTests, GraphQLTests]
    steps:
      - uses: actions/checkout@v4
      - name: resolve base url
        run: |
          URL="$E2E_URL"
          case "$URL" in
            https://*|http://*) ;;
            *) URL="https://$URL" ;;
          esac
          echo "BASE_URL=$URL" >> $GITHUB_ENV
        env:
          E2E_URL: ${{ secrets.E2E_URL }}
      - run: npm ci --prefer-offline
      - name: test
        run: npm run codeApiTests
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_MASTER_URL }}
          KEYCLOAK_DEV_PASS: ${{ secrets.KEYCLOAK_DEV_PASS }}
          KEYCLOAK_DEV_USER: ${{ secrets.KEYCLOAK_DEV_USER }}
          LOGIN_ATTEMPTS: 2
          LOGIN_DELAY_MS: 5000

  NodeTests:
    runs-on: [self-hosted, hkube-system-test]
    timeout-minutes: 45
    needs: [SwaggerTests, GraphQLTests]
    steps:
      - uses: actions/checkout@v4
      - name: runner info
        run: echo "runner=$RUNNER_NAME user=$(whoami) context=$KUBE_CONTEXT"
      - name: resolve base url
        run: |
          URL="$E2E_URL"
          case "$URL" in
            https://*|http://*) ;;
            *) URL="https://$URL" ;;
          esac
          echo "BASE_URL=$URL" >> $GITHUB_ENV
          echo "resolved host: $(echo "$URL" | sed -E 's#^https?://##' | cut -d/ -f1)"
        env:
          E2E_URL: ${{ secrets.E2E_URL }}
      - name: select kubeconfig context
        run: |
          # copy the shared kubeconfig to a per-job file so parallel jobs on the same
          # runner never fight over current-context / config.lock
          KUBECFG="$RUNNER_TEMP/kubeconfig-$GITHUB_RUN_ID-$GITHUB_JOB"
          install -m 600 /dev/null "$KUBECFG"
          cat /etc/hkube/kube/config > "$KUBECFG"
          kubectl --kubeconfig="$KUBECFG" config use-context "$KUBE_CONTEXT"
          echo "KUBECONFIG=$KUBECFG" >> $GITHUB_ENV
          echo "K8S_CONFIG_PATH=$KUBECFG" >> $GITHUB_ENV
      - name: verify kubectl
        run: kubectl cluster-info
      - run: npm ci --prefer-offline
      - name: test
        run: npm run nodetest
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_MASTER_URL }}
          KEYCLOAK_DEV_PASS: ${{ secrets.KEYCLOAK_DEV_PASS }}
          KEYCLOAK_DEV_USER: ${{ secrets.KEYCLOAK_DEV_USER }}
          K8S_VERSION: 1.13
          LOGIN_ATTEMPTS: 2
          LOGIN_DELAY_MS: 5000
      - name: cleanup kubeconfig
        if: always()
        run: rm -f "$KUBECONFIG"

  HkubeCliTests:
    runs-on: [self-hosted, hkube-system-test]
    timeout-minutes: 60
    needs: [JagearTests, NodeTests, PipelineTests, CodeApiTests]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - name: resolve base url
        run: |
          URL="$E2E_URL"
          case "$URL" in
            https://*|http://*) ;;
            *) URL="https://$URL" ;;
          esac
          echo "BASE_URL=$URL" >> $GITHUB_ENV
        env:
          E2E_URL: ${{ secrets.E2E_URL }}
      - name: select kubeconfig context
        run: |
          KUBECFG="$RUNNER_TEMP/kubeconfig-$GITHUB_RUN_ID-$GITHUB_JOB"
          install -m 600 /dev/null "$KUBECFG"
          cat /etc/hkube/kube/config > "$KUBECFG"
          kubectl --kubeconfig="$KUBECFG" config use-context "$KUBE_CONTEXT"
          echo "KUBECONFIG=$KUBECFG" >> $GITHUB_ENV
          echo "K8S_CONFIG_PATH=$KUBECFG" >> $GITHUB_ENV
      - run: npm ci --prefer-offline
      - name: create hkubectl
        run: |
          ./travis/cli.sh
          echo $PWD >> $GITHUB_PATH
      - name: test
        run: npm run cliTests
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_MASTER_URL }}
          KEYCLOAK_DEV_PASS: ${{ secrets.KEYCLOAK_DEV_PASS }}
          KEYCLOAK_DEV_USER: ${{ secrets.KEYCLOAK_DEV_USER }}
          K8S_VERSION: 1.13
          LOGIN_ATTEMPTS: 2
          LOGIN_DELAY_MS: 5000
      - name: cleanup kubeconfig
        if: always()
        run: rm -f "$KUBECONFIG"

  DatsourceTests:
    runs-on: [self-hosted, hkube-system-test]
    timeout-minutes: 60
    needs: [JagearTests, NodeTests, PipelineTests, CodeApiTests]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - name: resolve base url
        run: |
          URL="$E2E_URL"
          case "$URL" in
            https://*|http://*) ;;
            *) URL="https://$URL" ;;
          esac
          echo "BASE_URL=$URL" >> $GITHUB_ENV
        env:
          E2E_URL: ${{ secrets.E2E_URL }}
      - name: select kubeconfig context
        run: |
          KUBECFG="$RUNNER_TEMP/kubeconfig-$GITHUB_RUN_ID-$GITHUB_JOB"
          install -m 600 /dev/null "$KUBECFG"
          cat /etc/hkube/kube/config > "$KUBECFG"
          kubectl --kubeconfig="$KUBECFG" config use-context "$KUBE_CONTEXT"
          echo "KUBECONFIG=$KUBECFG" >> $GITHUB_ENV
          echo "K8S_CONFIG_PATH=$KUBECFG" >> $GITHUB_ENV
      - run: npm ci --prefer-offline
      - name: test
        run: npm run dataSourceTest
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_MASTER_URL }}
          KEYCLOAK_DEV_PASS: ${{ secrets.KEYCLOAK_DEV_PASS }}
          KEYCLOAK_DEV_USER: ${{ secrets.KEYCLOAK_DEV_USER }}
          GitHub_Token: ${{ secrets.GIT_TOKEN }}
          Gitlab_Token: ${{ secrets.GITLAB_TOKEN }}
          K8S_VERSION: 1.13
          LOGIN_ATTEMPTS: 2
          LOGIN_DELAY_MS: 5000
      - name: cleanup kubeconfig
        if: always()
        run: rm -f "$KUBECONFIG"

  AlgorithmTests:
    runs-on: [self-hosted, hkube-system-test]
    timeout-minutes: 60
    needs: [HkubeCliTests]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - name: resolve base url
        run: |
          URL="$E2E_URL"
          case "$URL" in
            https://*|http://*) ;;
            *) URL="https://$URL" ;;
          esac
          echo "BASE_URL=$URL" >> $GITHUB_ENV
        env:
          E2E_URL: ${{ secrets.E2E_URL }}
      - name: select kubeconfig context
        run: |
          KUBECFG="$RUNNER_TEMP/kubeconfig-$GITHUB_RUN_ID-$GITHUB_JOB"
          install -m 600 /dev/null "$KUBECFG"
          cat /etc/hkube/kube/config > "$KUBECFG"
          kubectl --kubeconfig="$KUBECFG" config use-context "$KUBE_CONTEXT"
          echo "KUBECONFIG=$KUBECFG" >> $GITHUB_ENV
          echo "K8S_CONFIG_PATH=$KUBECFG" >> $GITHUB_ENV
      - run: npm ci --prefer-offline
      - name: test
        run: npm run algorithmtest
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_MASTER_URL }}
          KEYCLOAK_DEV_PASS: ${{ secrets.KEYCLOAK_DEV_PASS }}
          KEYCLOAK_DEV_USER: ${{ secrets.KEYCLOAK_DEV_USER }}
          K8S_VERSION: 1.13
          LOGIN_ATTEMPTS: 2
          LOGIN_DELAY_MS: 5000
      - name: cleanup kubeconfig
        if: always()
        run: rm -f "$KUBECONFIG"

  StreamingTests:
    runs-on: [self-hosted, hkube-system-test]
    timeout-minutes: 60
    needs: [AlgorithmTests]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - name: resolve base url
        run: |
          URL="$E2E_URL"
          case "$URL" in
            https://*|http://*) ;;
            *) URL="https://$URL" ;;
          esac
          echo "BASE_URL=$URL" >> $GITHUB_ENV
        env:
          E2E_URL: ${{ secrets.E2E_URL }}
      - name: select kubeconfig context
        run: |
          KUBECFG="$RUNNER_TEMP/kubeconfig-$GITHUB_RUN_ID-$GITHUB_JOB"
          install -m 600 /dev/null "$KUBECFG"
          cat /etc/hkube/kube/config > "$KUBECFG"
          kubectl --kubeconfig="$KUBECFG" config use-context "$KUBE_CONTEXT"
          echo "KUBECONFIG=$KUBECFG" >> $GITHUB_ENV
          echo "K8S_CONFIG_PATH=$KUBECFG" >> $GITHUB_ENV
      - run: npm ci --prefer-offline
      - name: test
        run: npm run streaming
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_MASTER_URL }}
          KEYCLOAK_DEV_PASS: ${{ secrets.KEYCLOAK_DEV_PASS }}
          KEYCLOAK_DEV_USER: ${{ secrets.KEYCLOAK_DEV_USER }}
          K8S_VERSION: 1.13
          LOGIN_ATTEMPTS: 2
          LOGIN_DELAY_MS: 5000
      - name: cleanup kubeconfig
        if: always()
        run: rm -f "$KUBECONFIG"

  HighAvailability:
    runs-on: [self-hosted, hkube-system-test]
    timeout-minutes: 60
    needs: [AlgorithmTests, StreamingTests]
    if: ${{ always() }}
